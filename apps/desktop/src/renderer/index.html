<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yunwu Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p id="app-version-label" class="eyebrow">Yunwu Desktop</p>
        <h1>正在准备本地创作工作台</h1>
        <p id="message" class="message">准备启动本地服务。</p>
        <div class="actions">
          <button id="retry" type="button">重试</button>
          <button id="migrate-legacy" type="button" class="secondary" hidden>迁移旧版本数据</button>
          <button id="workbench" type="button" class="secondary">打开工作台</button>
          <button id="admin" type="button" class="secondary">打开管理台</button>
          <button id="folder" type="button" class="ghost">打开运行目录</button>
        </div>
      </section>

      <section class="grid">
        <article class="card">
          <h2>启动进度</h2>
          <div id="services" class="services"></div>
        </article>
        <article class="card">
          <h2>运行信息</h2>
          <dl class="facts">
            <div>
              <dt>桌面版本</dt>
              <dd id="app-version">-</dd>
            </div>
            <div>
              <dt>服务端口</dt>
              <dd id="port">-</dd>
            </div>
            <div>
              <dt>实例 ID</dt>
              <dd id="instance-id">-</dd>
            </div>
            <div>
              <dt>工作台</dt>
              <dd id="web-url">-</dd>
            </div>
            <div>
              <dt>数据目录</dt>
              <dd id="data-path">-</dd>
            </div>
            <div>
              <dt>运行目录</dt>
              <dd id="user-data">-</dd>
            </div>
            <div>
              <dt>旧数据迁移</dt>
              <dd id="legacy-state">-</dd>
            </div>
          </dl>
          <p id="legacy-message" class="update-message" hidden></p>
        </article>
        <article class="card">
          <h2>版本更新</h2>
          <dl class="facts">
            <div>
              <dt>更新状态</dt>
              <dd id="update-phase">unknown</dd>
            </div>
            <div>
              <dt>最新版本</dt>
              <dd id="latest-version">-</dd>
            </div>
          </dl>
          <p id="update-message" class="update-message">尚未检查更新。</p>
          <div id="update-progress" class="update-progress" hidden>
            <div class="update-progress-track"><div id="update-progress-bar"></div></div>
            <span id="update-progress-text" class="update-progress-text"></span>
          </div>
          <div class="actions compact-actions">
            <button id="apply-update" type="button" hidden>下载并更新</button>
            <button id="check-updates" type="button" class="secondary">检查更新</button>
            <button id="release-page" type="button" class="ghost">打开发布页</button>
          </div>
        </article>
      </section>

      <section class="card logs-card">
        <div class="logs-heading">
          <h2>运行日志</h2>
          <span id="phase" class="pill">idle</span>
        </div>
        <pre id="logs">等待启动日志...</pre>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
