name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag used for artifact names."
        required: true
        default: "v0.7.0"
      publish_release:
        description: "Upload artifacts to a GitHub Release for the version input."
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-portable:
    name: Build Electron Windows portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron portable package
        run: pnpm desktop:package

      - name: Upload Electron portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yunwu-Desktop-${{ steps.version.outputs.value }}-win-x64-portable
          path: apps/desktop/release/*portable.zip
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release artifact
    runs-on: ubuntu-latest
    needs: [windows-portable]
    if: github.ref_type == 'tag' || inputs.publish_release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "value=${{ inputs.version }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: Yunwu-Desktop-${{ steps.version.outputs.value }}-win-x64-portable
          path: release

      - name: Generate release manifest
        shell: bash
        run: |
          portable="$(find release -maxdepth 1 -type f -name '*portable.zip' | head -n 1)"
          if [[ -z "${portable}" ]]; then
            echo "No portable zip found in release/" >&2
            exit 1
          fi
          node scripts/release/write-release-manifest.mjs \
            --version "${{ steps.version.outputs.value }}" \
            --artifact "${portable}" \
            --output release/yunwu-release.json \
            --commit "${GITHUB_SHA}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          files: |
            release/*portable.zip
            release/yunwu-release.json
          generate_release_notes: true
